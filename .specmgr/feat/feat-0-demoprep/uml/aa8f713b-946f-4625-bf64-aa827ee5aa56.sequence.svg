" y2="162.6953"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.0308" x="644.9551" y="157.6294">User opens the page of the application in the browser.</text></g><g class="message" data-entity-1="part3" data-entity-2="part1" data-source-line="11" id="msg2"><polygon fill="#181818" points="648.9551,187.8281,638.9551,191.8281,648.9551,195.8281,644.9551,191.8281" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="642.9551" x2="1495.2881" y1="191.8281" y2="191.8281"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.1187" x="654.9551" y="186.7622">Frontend shows User the waiting message for the status.</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" data-source-line="12" id="msg3"><polygon fill="#181818" points="892.9751,216.9609,882.9751,220.9609,892.9751,224.9609,888.9751,220.9609" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="886.9751" x2="1495.2881" y1="220.9609" y2="220.9609"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.3867" x="898.9751" y="215.895">Frontend sends the request GET /status to Backend.</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" data-source-line="13" id="msg4"><polygon fill="#181818" points="1484.2881,246.0938,1494.2881,250.0938,1484.2881,254.0938,1488.2881,250.0938" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="881.9751" x2="1490.2881" y1="250.0938" y2="250.0938"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="537.3228" x="888.9751" y="245.0278">Backend sends the response with the state and the time of the check to Frontend.</text></g><path d="M609,265.0938 L673.4429,265.0938 L673.4429,272.2266 L663.4429,282.2266 L609,282.2266 L609,265.0938" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="81.3984" style="stroke:#000000;stroke-width:1.5;" width="1682.9102" x="609" y="265.0938"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="19.4429" x="624" y="278.1606">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="217.6904" x="688.4429" y="277.3042">[Backend sends an error response]</text><g class="message" data-entity-1="part2" data-entity-2="part3" data-source-line="15" id="msg5"><polygon fill="#181818" points="1484.2881,299.3594,1494.2881,303.3594,1484.2881,307.3594,1488.2881,303.3594" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="881.9751" x2="1490.2881" y1="303.3594" y2="303.3594"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="590.313" x="888.9751" y="298.2935">Backend sends the error response with the error code and the trace identifier to Frontend.</text></g><g class="message" data-entity-1="part3" data-entity-2="part1" data-source-line="16" id="msg6"><polygon fill="#181818" points="648.9551,331.4922,638.9551,335.4922,648.9551,339.4922,644.9551,335.4922" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="642.9551" x2="1495.2881" y1="335.4922" y2="335.4922"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="798.3384" x="654.9551" y="330.4263">Frontend shows User the heading that the information is not available, the text for the error code, and the trace identifier.</text></g><path d="M1501,316.3594 L1501,341.3594 L2276,341.3594 L2276,326.3594 L2266,316.3594 L1501,316.3594" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2266,316.3594 L2266,326.3594 L2276,326.3594 L2266,316.3594" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="754.6221" x="1507" y="333.4263">The text is in the language of the page. Frontend does not show the members title and detail of the error response.</text><path d="M609,360.4922 L673.4429,360.4922 L673.4429,367.625 L663.4429,377.625 L609,377.625 L609,360.4922" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="52.2656" style="stroke:#000000;stroke-width:1.5;" width="1182.7974" x="609" y="360.4922"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="19.4429" x="624" y="373.5591">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="179.2656" x="688.4429" y="372.7026">[Backend gives no response]</text><g class="message" data-entity-1="part3" data-entity-2="part1" data-source-line="22" id="msg8"><polygon fill="#181818" points="648.9551,397.7578,638.9551,401.7578,648.9551,405.7578,644.9551,401.7578" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="642.9551" x2="1495.2881" y1="401.7578" y2="401.7578"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="774.3188" x="654.9551" y="396.6919">Frontend shows User the heading that the information is not available and the text that the service gives no response.</text></g><path d="M1501,382.625 L1501,407.625 L1776,407.625 L1776,392.625 L1766,382.625 L1501,382.625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1766,382.625 L1766,392.625 L1776,392.625 L1766,382.625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.5093" x="1507" y="399.6919">There is no trace identifier in this case.</text><path d="M609,426.7578 L673.4429,426.7578 L673.4429,433.8906 L663.4429,443.8906 L609,443.8906 L609,426.7578" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="52.2656" style="stroke:#000000;stroke-width:1.5;" width="1182.7974" x="609" y="426.7578"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="19.4429" x="624" y="439.8247">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="343.1807" x="688.4429" y="438.9683">[Backend sends a response that Frontend cannot read]</text><g class="message" data-entity-1="part3" data-entity-2="part1" data-source-line="28" id="msg10"><polygon fill="#181818" points="648.9551,464.0234,638.9551,468.0234,648.9551,472.0234,644.9551,468.0234" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="642.9551" x2="1495.2881" y1="468.0234" y2="468.0234"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="832.8696" x="654.9551" y="462.9575">Frontend shows User the heading that the information is not available and the text that the response of the service is not valid.</text></g><path d="M1501,448.8906 L1501,473.8906 L1776,473.8906 L1776,458.8906 L1766,448.8906 L1501,448.8906" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1766,448.8906 L1766,458.8906 L1776,458.8906 L1766,448.8906" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.5093" x="1507" y="465.9575">There is no trace identifier in this case.</text><g class="message" data-entity-1="part3" data-entity-2="part1" data-source-line="33" id="msg12"><polygon fill="#181818" points="648.9551,536.4219,638.9551,540.4219,648.9551,544.4219,644.9551,540.4219" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="642.9551" x2="1495.2881" y1="540.4219" y2="540.4219"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="641.875" x="654.9551" y="535.356">Frontend shows User the text for the state and the time of the check, in the language of the page.</text></g><path d="M1501,491.0234 L1501,576.0234 L1780,576.0234 L1780,501.0234 L1770,491.0234 L1501,491.0234" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1770,491.0234 L1770,501.0234 L1780,501.0234 L1770,491.0234" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.022" x="1507" y="508.0903">Step 4: Frontend shows the state as</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.0347" x="1507" y="523.2231">English: The system is up.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.8584" x="1507" y="538.356">English: The system is degraded.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.9126" x="1507" y="553.4888">German: Das System l&#228;uft.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.4702" x="1507" y="568.6216">German: Das System ist eingeschr&#228;nkt.</text><g class="message" data-entity-1="part1" data-entity-2="part1" data-source-line="41" id="msg14"><line style="stroke:#181818;stroke-width:1;" x1="637.9551" x2="679.9551" y1="602.8203" y2="602.8203"/><line style="stroke:#181818;stroke-width:1;" x1="679.9551" x2="679.9551" y1="602.8203" y2="615.8203"/><line style="stroke:#181818;stroke-width:1;" x1