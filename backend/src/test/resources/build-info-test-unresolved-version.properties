# The version of the build that the filter did not replace (feat-9-walking-skeleton): the placeholder
# ${build.info.version} of the template stays if the resource is not filtered, and the commit is a real value. The
# reader BuildInfoProvider stops for the version too, and the test of the reader loads this resource.
version=${build.info.version}
commit=0123456789abcdef0123456789abcdef01234567
