# The configuration of the service (feat-9-walking-skeleton). The members of a response that have no value are
# not in the JSON: the schema Problem of the contract has optional members (title, detail), and the response of the
# error has the machine values only (no member with a text in a language, REQ 1ca335d7-969a-443e-9392-165fdeea99a0).
# The generated model classes have no annotation that leaves a member out (the option generateJsonIncludeAnnotations
# of the generator is false), so the setting is the one of the mapper of the service.
spring.jackson.default-property-inclusion=non_null
